summary:
  en: "Computer-vision pipeline that turns a photo of a hand-drawn survey sketch into a topographic DXF. Marker detection, OCR, block library. Cuts manual drafting from 4 hours to 15 minutes."
  ru: "CV-пайплайн, который превращает фото рукописного абриса в топографический DXF. Детекция маркеров, OCR, библиотека блоков. Ручное черчение: 4 часа → 15 минут."

problem:
  en: "A surveyor draws a field abris by hand, then spends hours transferring numbered points and symbols into CAD. The process is slow, repetitive and error-prone."
  ru: "Геодезист рисует абрис от руки, а потом часы переносит точки и условные знаки в CAD. Процесс медленный, монотонный и подверженный ошибкам."

approach:
  en:
    - "Marker and text detection on a phone photo, followed by OCR for point numbers and labels."
    - "A 444-block GUGK sign library with a fidelity audit against the reference template."
    - "DXF generation with a PySide6/QML desktop shell and CI quality gates."
  ru:
    - "Детекция маркеров и текста на фото с телефона, OCR для номеров точек и подписей."
