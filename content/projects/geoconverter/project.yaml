title:
  en: "GeoConverter — geodetic coordinate conversion"
  ru: "GeoConverter — конвертация геодезических координат"

summary:
  en: "Commercial desktop product for sub-millimetre conversion between legacy local coordinate systems and WGS-84. Four-stage numerical calibration, round-trip validation, hardware-locked licensing."
  ru: "Коммерческий desktop-продукт для субмиллиметровой конвертации между локальными системами координат и WGS-84. Четырёхстадийная численная калибровка, проверка невязки, аппаратная привязка лицензий."

problem:
  en: "Converting coordinates between legacy local systems and modern global datums requires sub-millimetre precision under strong non-linear distortions. Off-the-shelf tools either lose precision or require a server."
  ru: "Конвертация координат между локальными системами и современными глобальными датумами требует субмиллиметровой точности при сильных нелинейных искажениях. Готовые инструменты либо теряют точность, либо требуют сервера."

approach:
  en:
    - "Four-stage pipeline: Helmert/SVD → Levenberg-Marquardt → Nelder-Mead, tolerance 1e-12."
    - "Round-trip error validation: the closed route must return within millimetres."
    - "PyQt6 desktop product with hardware-locked activation keys and an offline license issuer."
  ru:
    - "Четырёхстадийный пайплайн: Helmert/SVD → Левенберг-Марквардт → Нелдер-Мид, допуск 1e-12."
    - "Проверка невязки: замкнутый маршрут должен вернуться с миллиметровой точностью."
    - "Desktop-продукт на PyQt6 с аппаратной привязкой ключей и офлайн-генератором лицензий."

