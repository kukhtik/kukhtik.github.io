title:
  en: "Engineer Companion — offline RAG"
  ru: "Engineer Companion — offline-RAG"

summary:
  en: "Offline RAG over radiotherapy equipment documentation. Hybrid LanceDB + BM25 retrieval, local embeddings and reranker, CPU-only. Answers cite document, page and drawing region."
  ru: "Offline-RAG по документации радиотерапевтического оборудования. Гибридный поиск LanceDB + BM25, локальные эмбеддинги и реранкер, CPU-only. Ответы цитируют документ, страницу и область чертежа."

problem:
  en: "A field engineer servicing a clinical linear accelerator works in an RF-shielded bunker with no internet and needs the exact page of a specification in seconds — out of tens of thousands of pages of manuals."
  ru: "Инженер, обслуживающий клинический линейный ускоритель, работает в экранированном бункере без интернета и должен за секунды найти точную страницу спецификации среди десятков тысяч страниц руководств."

approach:
  en:
    - "One Python core: PDF indexing, chunking, embeddings, LanceDB retrieval and a fact catalogue."
    - "Hybrid retrieval: dense vectors + BM25, with a cross-encoder reranker."
    - "Local quantized inference (Gemma-3-4B, GGUF / llama.cpp); every answer carries an evidence link to document, page and drawing region."
  ru:
    - "Одно Python-ядро: индексация PDF, чанкинг, эмбеддинги, поиск в LanceDB и каталог фактов."
    - "Гибридный поиск: dense-векторы + BM25, с кросс-энкодерным реранкером."
    - "Локальный квантованный инференс (Gemma-3-4B, GGUF / llama.cpp); каждый ответ несёт ссылку на документ, страницу и область чертежа."

