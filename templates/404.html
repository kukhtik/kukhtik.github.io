{% extends "base.html" %}
{% block content %}
<section class="not-found">
  <div class="wrap">
    <p class="code">404</p>
    <h1>{{ ui.not_found.title[lang] }}</h1>
    <p>{{ ui.not_found.text[lang] }}</p>
    <div class="actions">
      <a class="btn" href="{{ home_url }}">{{ ui.actions.back_home[lang] }}</a>
      <a class="btn-ghost" href="{{ home_url }}#work"><span>{{ ui.actions.back_to_work[lang] }}</span></a>
    </div>
  </div>
</section>
{% endblock %}
