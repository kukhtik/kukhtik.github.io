<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ seo_title }}</title>
  <meta name="description" content="{{ seo_description }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="alternate" hreflang="en" href="{{ alternate_en }}">
  <link rel="alternate" hreflang="ru" href="{{ alternate_ru }}">
  <link rel="alternate" hreflang="x-default" href="{{ alternate_en }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ seo_title }}">
  <meta property="og:description" content="{{ seo_description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ site.domain }}{{ og_image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ seo_title }}">
  <meta name="twitter:description" content="{{ seo_description }}">
  <meta name="twitter:image" content="{{ site.domain }}{{ og_image }}">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
</head>
<body>
  <a class="skip" href="#main">{{ ui.actions.skip[lang] }}</a>

  <header class="site-head">
    <div class="wrap site-head-inner">
      <a class="brand" href="{{ home_url }}">{{ t(site.name, lang) }}</a>
      <nav class="nav" aria-label="{{ ui.nav.label[lang] }}">
        <a href="{{ home_url }}#work">{{ ui.nav.work[lang] }}</a>
        <a href="{{ home_url }}#about">{{ ui.nav.about[lang] }}</a>
        <a href="{{ home_url }}#contact">{{ ui.nav.contact[lang] }}</a>
        <a class="lang" href="{{ other_home_url }}" hreflang="{{ other_lang }}" lang="{{ other_lang }}">{{ other_lang_label }}</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-foot">
    <div class="wrap site-foot-inner">
      <span>© {{ year }} {{ t(site.name, lang) }} · {{ ui.footer.rights[lang] }}</span>
      <span class="foot-links">
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        <a href="{{ site.github }}">GitHub</a>
        <a href="{{ site.linkedin }}">LinkedIn</a>
      </span>
    </div>
  </footer>
</body>
</html>
