<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_description }}">
<meta name="author" content="{{ t(site.name, lang) }}">
<link rel="canonical" href="{{ canonical }}">
<link rel="alternate" hreflang="en" href="{{ alternate_en }}">
<link rel="alternate" hreflang="ru" href="{{ alternate_ru }}">
<link rel="alternate" hreflang="x-default" href="{{ alternate_en }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ site.domain }}{{ og_image }}">
<meta property="og:site_name" content="{{ t(site.name, lang) }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230f1418'/%3E%3Crect x='3' y='3' width='7' height='26' fill='%23e38b8b'/%3E%3Crect x='13' y='3' width='16' height='9' fill='%23e6b564'/%3E%3Crect x='13' y='15' width='10' height='14' fill='%23c2b9e6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/lcars/fonts.css">
<link rel="stylesheet" href="/assets/lcars/lcars.css">
<link rel="stylesheet" href="/assets/lcars/app.css">
{% block head_extra %}{% endblock %}
</head>
<body>
<div class="screen lcars">
<div class="rail-host wrap">
<div class="l-rail" aria-hidden="true">
  <i style="--c:var(--lc-coral);--h:3"></i>
  <i style="--c:var(--lc-lilac);--h:1"></i>
  <i style="--c:var(--lc-apricot);--h:2"></i>
  <i style="--c:var(--lc-mint);--h:1"></i>
  <i style="--c:var(--lc-sand);--h:4"></i>
  <i style="--c:var(--lc-periwinkle);--h:2"></i>
  <i style="--c:var(--lc-amber);--h:3"></i>
</div>
<main>
{% block content %}{% endblock %}
</main>
</div>
</div>
<script src="/assets/lcars/vendor/gsap.min.js"></script>
<script src="/assets/lcars/vendor/ScrollTrigger.min.js"></script>
<script src="/assets/lcars/app.js"></script>
</body>
</html>
