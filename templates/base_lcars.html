<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_description }}">
<meta name="author" content="{{ t(site.name, lang) }}">
<link rel="canonical" href="{{ canonical }}">
<link rel="alternate" hreflang="en" href="{{ alternate_en }}">
<link rel="alternate" hreflang="ru" href="{{ alternate_ru }}">
<link rel="alternate" hreflang="x-default" href="{{ alternate_en }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ site.domain }}{{ og_image }}">
<meta property="og:site_name" content="{{ t(site.name, lang) }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_description }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Crect x='0' y='0' width='32' height='7' fill='%23ffae01'/%3E%3Crect x='0' y='7' width='7' height='25' fill='%23a5b7e2'/%3E%3Crect x='25' y='7' width='7' height='25' fill='%23dd616e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/lcars/fonts.css">
<link rel="stylesheet" href="/assets/lcars/lcars.css">
<link rel="stylesheet" href="/assets/lcars/app.css">
{% block head_extra %}{% endblock %}
</head>
<body>
<div class="screen lcars">
<main class="lcars-main">
{% block content %}{% endblock %}
</main>
</div>
<script src="/assets/lcars/vendor/gsap.min.js"></script>
<script src="/assets/lcars/vendor/ScrollTrigger.min.js"></script>
<script src="/assets/lcars/app.js"></script>
</body>
</html>
