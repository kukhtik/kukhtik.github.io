<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Isodose distribution and central axis dose profile</title>
<desc id="dsc">Sagittal isodose section around the primary beam axis with a colour ramp from the hot amber centre through coral to the cold fringe, above a central axis depth dose profile with the 90 % and 50 % isodose levels and their depths marked.</desc>
<style>
