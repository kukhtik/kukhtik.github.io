.rule{fill:none;stroke:#9fe8f5;stroke-width:5;stroke-linecap:butt}
.dim{fill:none;stroke:#9fe8f5;stroke-width:0.8;stroke-dasharray:6 4}
.dimline{fill:none;stroke:#9fe8f5;stroke-width:1}
.grid{fill:none;stroke:#3f9cb4;stroke-width:0.6;stroke-dasharray:3 5}
.axis{fill:none;stroke:#6fd3e8;stroke-width:0.8}
.lbl{fill:#9fe8f5;font-family:'PT Sans Narrow','Arial Narrow',system-ui,sans-serif;font-size:12px;letter-spacing:0.09em}
.lbl-hi{fill:#dff8ff}
.lbl-dim{fill:#6fb2c4;font-size:11px;letter-spacing:0.07em}
.lbl-mono{fill:#9fe8f5;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.04em}
.iso-90{fill:none;stroke:#FFAE01;stroke-width:1.5}
.iso-80{fill:none;stroke:#F09A3C;stroke-width:1.4}
.iso-70{fill:none;stroke:#E5863F;stroke-width:1.3}
.iso-60{fill:none;stroke:#DC7046;stroke-width:1.3}
.iso-50{fill:none;stroke:#DD616E;stroke-width:1.4}
.iso-40{fill:none;stroke:#B85A72;stroke-width:1.2}
.iso-30{fill:none;stroke:#A8567A;stroke-width:1.2}
.iso-20{fill:none;stroke:#8E5F7B;stroke-width:1.1}
.iso-10{fill:none;stroke:#6E5A6B;stroke-width:1.1}
.wave{fill:none;stroke:#9fe8f5;stroke-width:1.6}
