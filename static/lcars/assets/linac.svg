<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Medical linear accelerator, side elevation</title>
<desc id="dsc">Side elevation of a Varian style medical linear accelerator. The gantry is a C shaped rotating arm centred on the isocentre. The treatment head rides on the gantry, the multi leaf collimator sits in the head, the beam cone runs from the MLC to the patient lying on the couch. Dimension rules give the SAD of 100 cm and the 20 cm field at the isocentre.</desc>
