<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" id="plate-linac" data-od-id="plate-linac" role="img" aria-labelledby="plate-ttl plate-dsc" preserveAspectRatio="xMidYMid meet">
<title id="plate-ttl">Medical linear accelerator - central console plate</title>
<desc id="plate-dsc">Wide side elevation of a medical linear accelerator drawn in cyan line work on a transparent field. A thick C-shaped gantry arc carries the treatment head with its multi-leaf collimator; an amber beam cone falls from the head to the isocentre, where nested cyan-to-amber isodose rings sit. A couch with its rail carries the patient outline. Callout leader lines reach out of the drawing for GANTRY, TREATMENT HEAD, MLC, BEAM, ISOCENTRE, COUCH, PATIENT, SAD and FIELD.</desc>
<style>
@font-face{font-family:'PT Sans Narrow';src:url('../fonts/pt-sans-narrow-700-latin.woff2') format('woff2');font-weight:700;font-display:swap;}
@font-face{font-family:'IBM Plex Mono';src:url('../fonts/plex-mono-400-latin.woff2') format('woff2');font-weight:400;font-display:swap;}
.struct{fill:none;stroke:#6fd3e8;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;}
.struct-hi{fill:none;stroke:#9fe8f5;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
.struct-f{fill:none;stroke:#6fd3e8;stroke-width:.8;stroke-linecap:round;}
.struct-d{fill:none;stroke:#3f9cb4;stroke-width:.9;stroke-linecap:round;}
.rib{fill:none;stroke:#4fb2c8;stroke-width:.9;stroke-linecap:round;}
.cable{fill:none;stroke:#4fb2c8;stroke-width:.8;stroke-linecap:round;}
.detail{fill:none;stroke:#9fe8f5;stroke-width:.9;stroke-linecap:round;}
.axis{fill:none;stroke:#6fd3e8;stroke-width:.8;stroke-dasharray:7 5;}
.dim{fill:none;stroke:#57b4cb;stroke-width:.8;stroke-dasharray:6 4;}
.dimline{fill:none;stroke:#9fe8f5;stroke-width:1;}
.cone{fill:none;stroke:#ffae01;stroke-width:1.2;stroke-linejoin:round;}
.cone-fill{fill:#ffae01;fill-opacity:.16;stroke:none;}
.cone-core{fill:none;stroke:#ffc24d;stroke-width:.7;stroke-dasharray:4 4;}
.field{fill:none;stroke:#ffae01;stroke-width:1.4;}
.source{fill:none;stroke:#ffc24d;stroke-width:1.2;}
.iso-1{fill:none;stroke:#6fd3e8;stroke-width:1.2;}
.iso-2{fill:none;stroke:#9fe8f5;stroke-width:1.2;}
.iso-3{fill:none;stroke:#ffd07a;stroke-width:1.2;}
.iso-4{fill:none;stroke:#ffa32b;stroke-width:1.3;}
.iso-5{fill:none;stroke:#ef6f5c;stroke-width:1.4;}
.iso-cross{fill:none;stroke:#dff8ff;stroke-width:1.3;}
.leader{fill:none;stroke:#7fd0e6;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;}
.leader-dot{fill:#7fd0e6;stroke:none;}
.lbl-bar{fill:#6fd3e8;stroke:none;}
.lbl{fill:#cdeffc;font-family:'PT Sans Narrow','Arial Narrow','Liberation Sans Narrow',sans-serif;font-size:13px;font-weight:700;letter-spacing:.13em;}
.lbl-warm{fill:#ffc98a;font-family:'PT Sans Narrow','Arial Narrow','Liberation Sans Narrow',sans-serif;font-size:13px;font-weight:700;letter-spacing:.13em;}
.dim-text{fill:#8fd9ec;font-family:'IBM Plex Mono','Consolas',monospace;font-size:12px;letter-spacing:.04em;}
.dim-text-w{fill:#ffd9a0;font-family:'IBM Plex Mono','Consolas',monospace;font-size:12px;letter-spacing:.04em;}
.caption{fill:#3f9cb4;font-family:'PT Sans Narrow','Arial Narrow',sans-serif;font-size:11px;letter-spacing:.22em;}
</style>

