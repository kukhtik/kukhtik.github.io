<!-- the scroll track: the page scrolls, the console never moves -->
<div class="track" id="track"></div>

<main class="console" id="console">

  <!-- ================= THE FRAME ================= -->
  <!-- ONE continuous frame: the top rail turns 90 degrees at its LEFT end
       and becomes the spine that runs the full height. One elbow:
       rounded outer corner, sharp inner corner. -->
  <div class="frame" aria-hidden="true">
    <div class="frame__rail" id="frame-rail"></div>
    <div class="frame__spine" id="frame-spine"></div>
    <div class="frame__elbow" id="frame-elbow"></div>
    <!-- the slot in the rail where the machine parks in the dose state -->
    <span class="railcap" id="railcap"></span>
  </div>

  <!-- the filled label block near the rail's right end, with the switch -->
  <div class="railblock" id="railblock">
    <span class="railblock__name" data-i18n="ui.who">Maxim Kukhto</span>
    <span class="railblock__lang">
      <a class="railblock__langbtn" id="lang-en" href="./" data-lang="en" hreflang="en">EN</a>
      <a class="railblock__langbtn" id="lang-ru" href="ru/" data-lang="ru" hreflang="ru">RU</a>
    </span>
  </div>

  <!-- ================= LEFT: the panel group the bracket wraps ================= -->
  <section class="zone zone--left" aria-label="Profile">
    <header class="identity" id="identity" data-od-id="identity">
      <p class="identity__eyebrow" id="identity-eyebrow"></p>
      <h1 class="identity__name" id="identity-name"></h1>
      <p class="identity__lead" id="identity-lead"></p>
      <div class="identity__side" id="identity-side"></div>
    </header>

    <div class="leftgroup" id="leftgroup">
      <!-- the periwinkle bracket: ONE continuous path wrapping this group -->
      <div class="bracket" id="bracket" aria-hidden="true"></div>

      <div class="panel" id="panel-cap" data-od-id="panel-capabilities">
        <div class="panel__legend">
          <span class="legend legend--amber"></span>
          <span class="panel__title" data-i18n="ui.capTitle">Capabilities</span>
          <span class="panel__tag" data-i18n="ui.capTag">Three areas</span>
        </div>
        <div data-render="capabilities"></div>
      </div>

      <div class="panel" id="panel-rec" data-od-id="panel-record">
        <div class="panel__legend">
          <span class="legend legend--coral"></span>
          <span class="panel__title" data-i18n="ui.recordTitle">Service record</span>
          <span class="panel__tag" data-i18n="ui.recordTag">2020 - 2026</span>
        </div>
        <div data-render="record"></div>
      </div>

      <!-- the dense status report: it fills the bottom-left in the work state -->
      <div class="panel panel--report" id="panel-report" data-od-id="panel-report">
        <div class="panel__legend">
          <span class="legend legend--lav"></span>
          <span class="panel__title" data-i18n="ui.reportTitle">System online</span>
          <span class="panel__tag" data-i18n="ui.reportTag">Report</span>
        </div>
        <div class="report" data-render="report"></div>
      </div>
    </div>
  </section>
