<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · Python / AI engineer</title>
<meta name="description" content="{{META_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/lcars.css">
<link rel="stylesheet" href="/assets/content.css">
</head>
<body data-page="{{PAGE}}">
<a class="own-skip" href="#main">Skip to content</a>
<section class="wrap-standard" id="column-3">
  <div class="wrap">

    <div class="left-frame-top">
      <button class="panel-1" type="button">{{SLOT:hero.name}}<span class="hop">·PY/AI</span></button>
      <button class="panel-2" type="button">{{SLOT:status.place}}<span class="hop">·{{SLOT:status.from}}</span></button>
    </div>

    <div class="right-frame-top">
      <h1 class="banner">
        <span class="banner__cap">{{SLOT:float.caption}}</span> {{SLOT:hero.name}} &#149; <span id="stardate"> </span>
        <a class="banner__lang" href="#" data-lang-toggle>{{SLOT:chrome.lang}}</a>
      </h1>

      <div class="data-cascade-button-group">
        <div class="data-cascade-wrapper" id="default">
{{CASCADE}}
        </div>

        <nav aria-label="Primary" data-page="home">
          <a href="{{RU}}/" class="nav-1 animation-on" data-block="nav.home" aria-current="page">01-{{SLOT:nav.home}}</a>
          <a href="{{RU}}/work/" class="nav-2 animation-on" data-block="nav.work">02-{{SLOT:nav.work}}</a>
          <a href="{{RU}}/about/" class="nav-3" data-block="nav.about">03-{{SLOT:nav.about}}</a>
          <a href="{{RU}}/contact/" class="nav-4 animation-on" data-block="nav.contact">04-{{SLOT:nav.contact}}</a>
        </nav>
      </div>

      <div class="bar-panel first-bar-panel">
        <div class="bar-1"></div>
        <div class="bar-2"></div>
        <div class="bar-3"></div>
        <div class="bar-4"></div>
        <div class="bar-5"></div>
      </div>
    </div>

  </div>

  <div class="wrap" id="gap">
    <div class="left-frame">
      <button id="topBtn" type="button"><span class="hop">screen</span> top</button>
            <div>
        {{PANELS}}
      </div>
            <div>
        <button class="panel-7" type="button" data-target="sec-links">05<span class="hop">CONTACT</span></button>
      </div>
    </div>

    <div class="right-frame">
      <div class="bar-panel">
        <div class="bar-6"></div>
        <div class="bar-7"></div>
        <div class="bar-8"></div>
        <div class="bar-9"></div>
        <div class="bar-10"></div>
      </div>


      <main id="main">
{{CONTENT}}
      </main>
    </div>
  </div>
</section>

<script src="/assets/app.js"></script>
</body>
</html>
